          	   of kills the program where it stands, with nothing in the log. Say so where it happens instead */
          	fprintf(stderr, "task %u: %u KB of stack%s (%u KB taken by stacks in all)\n", tasks_made,
          		(unsigned)(granted >> 10), granted < sizes[0] ? "  *** LESS THAN IT ASKED FOR ***" : "",
          		(unsigned)(stacks_taken >> 10));
