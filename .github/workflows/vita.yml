          		}
          		else
          		{
          			/* (the first frame, or the one after a frame left out: none to show yet) */
          			s32_video_draw_frame_begin();
          			vita_frame_begun = true;
          			pace_video += SDL_GetPerformanceCounter() - start;
          		}
          		return;
          	}
          #endif
          	s32_video_draw_frame();
          	drawn = SDL_GetPerformanceCounter();
          	show_screens();
          	pace_video += drawn - start;
          	pace_showing += SDL_GetPerformanceCounter() - drawn;""")

