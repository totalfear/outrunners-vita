          /* The Vita's kernel does not let a program run on a stack it did not get from the kernel: a system call made from
             one stops the program as a stack overflow (what a task with its stack made by hand did on the real machine). So a
             task is a thread of its own, with a stack of its own made by pthreads, and only one of the threads runs at a time:
             a switch hands the turn to the task that is wanted, and the task that asks waits for its own.  VITA_TASK_THREADS_PINNED */
          #include <pthread.h>

          void orunners_vita_pin(int mask);    /* (ports/vita/vita_pin.c) */

          struct host_task
          {
          	pthread_cond_t wake;
          	int go;                    /* it is this task's turn to run */
          	void (*start)(void);
          };

          static pthread_mutex_t turn;    /* one lock for all the hand-overs */
          static host_task main_task;
          static host_task *current;

          static void tasks_start_up(void)
          {
          	if (!current)
          	{
          		pthread_mutex_init(&turn, NULL);
          		pthread_cond_init(&main_task.wake, NULL);
          		current = &main_task;
          	}
          }

          host_task *host_task_main(void)
          {
          	tasks_start_up();
          	return &main_task;
          }

          static void *run_task(void *argument)
          {
          	host_task *task = argument;

          	orunners_vita_pin(0x10000);    /* (every task on the game's core: a hand-over there is a plain switch, not a wake-up across cores) */
          	pthread_mutex_lock(&turn);
          	while (!task->go)
          		pthread_cond_wait(&task->wake, &turn);
          	task->go = 0;
          	pthread_mutex_unlock(&turn);
          	task->start();
          	fprintf(stderr, "A task came to its end\n");
          	exit(3);
          	return NULL;
          }

          host_task *host_task_create(void (*start)(void))
          {
          	static const size_t sizes[] = { TASK_STACK_SIZE, TASK_STACK_SIZE / 2, TASK_STACK_SIZE / 4 };
          	static unsigned tasks_made;
          	static size_t stacks_taken;
          	host_task *task = calloc(1, sizeof(*task));
          	pthread_t thread;
          	size_t granted = 0;
          	int made = 0;

          	tasks_start_up();
          	if (task)
          	{
          		task->start = start;
          		pthread_cond_init(&task->wake, NULL);
          		for (size_t size = 0; size < sizeof(sizes) / sizeof(sizes[0]) && !made; size++)
          		{
          			pthread_attr_t attributes;

          			pthread_attr_init(&attributes);
          			pthread_attr_setstacksize(&attributes, sizes[size]);
          			made = pthread_create(&thread, &attributes, run_task, task) == 0;
          			pthread_attr_destroy(&attributes);
          			if (made)
          				granted = sizes[size];
          		}
          	}
          	if (!task || !made)
          	{
          		fprintf(stderr, "A task could not be created (%u made, %u KB of stacks taken)\n",
          			tasks_made, (unsigned)(stacks_taken >> 10));
          		exit(3);
          	}
          	tasks_made++;
          	stacks_taken += granted;
          	/* A task given less than it asked for is the one that will fall over, and a stack it runs off the end
          	   of kills the program where it stands, with nothing in the log. Say so where it happens instead */
          	fprintf(stderr, "task %u: %u KB of stack%s (%u KB taken by stacks in all)\n", tasks_made,
          		(unsigned)(granted >> 10), granted < sizes[0] ? "  *** LESS THAN IT ASKED FOR ***" : "",
          		(unsigned)(stacks_taken >> 10));
