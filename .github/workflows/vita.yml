name: Build Vita VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    env:
      VITASDK: /usr/local/vitasdk
      PKG_CONFIG_PATH: /usr/local/vitasdk/arm-vita-eabi/lib/pkgconfig
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y ninja-build pkg-config python3 git

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check the SDK and SDL2
        run: |
          export PATH=$VITASDK/bin:$PATH
          ls $VITASDK/bin | head -40
          ls $VITASDK/arm-vita-eabi/lib/pkgconfig | grep -i sdl || echo "no SDL2 in the image"

      - name: Configure
        run: |
          export PATH=$VITASDK/bin:$PATH
          cmake -S . -B build/vita -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-g \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
            -DORUNNERS_VITA=ON -DORUNNERS_REFERENCE_TOOLS=OFF

      - name: Build VPK
        run: |
          export PATH=$VITASDK/bin:$PATH
          cmake --build build/vita --target OutRunners.vpk 2>&1 | tee build.log

      - name: Save the VPK
        uses: actions/upload-artifact@v7
        with:
          name: OutRunners-vpk
          path: build/vita/OutRunners.vpk

      - name: Save the ELF (for crash reports)
        uses: actions/upload-artifact@v7
        with:
          name: OutRunners-elf
          path: build/vita/OutRunners

      - name: Save the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
