          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/workers.c: the Vita edits are in")
          else:
              print("runtime/src/workers.c: the Vita edits were already in")
          WORKERS_EDITS
          python3 - <<'VIDEO_EDITS'
          import io, re, sys

          path = "runtime/src/video.c"
          s = io.open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")
          done, problems = [], []

          # --- 1. the sprite erase ---
          # s32_video_sprites erases the sprite buffer of EVERY screen, 218 KB each and a pixel at a time, while
          # draw_sprite already leaves a screen the port does not show alone: erasing that one is work for nothing.
          # The Vita shows one screen, so this saves 218 KB of writes a frame, and what is left is a memset
          ERASE = re.compile(r"(?m)^[ \t]*for \(size_t index = 0; index < \(size_t\)HEIGHT \* WIDTH; index\+\+\)\n[ \t]*shown\[index\] = 0xffff;\n")
          ERASE_NEW = ("\t\t\tif (!bit((uint32_t)video.screens_shown, screen))\n"
                       "\t\t\t\tcontinue;    /* (a screen the port does not show: draw_sprite leaves its sprites alone too) */\n"
                       "\t\t\tmemset(shown, 0xff, (size_t)HEIGHT * WIDTH * sizeof(shown[0]));    /* (0xffff a pixel: no sprite there) */\n")

          if "draw_sprite leaves its sprites alone too" in s:
              done.append("sprite erase: already in")
          elif len(ERASE.findall(s)) != 1:
              problems.append("sprite erase: the loop was found %d times (wanted 1)" % len(ERASE.findall(s)))
          else:
              s = ERASE.sub(lambda m: ERASE_NEW, s, count=1)
              done.append("sprite erase: added")

          # --- 3. splitting the frame's video in two: drawing the layers, and mixing them into the screen ---
          # s32_video_draw_frame is the biggest item in the Vita's log and nothing says where inside it the time
          # goes. These two counters are microseconds, read and zeroed by the port (ports/sdl2/main.c)
          CLOCK = """#ifdef __vita__
          #include <time.h>

          /* (the Vita's log: where s32_video_draw_frame's time goes, in microseconds; the port reads them and puts
             them back to nothing every time it writes a line) */
          uint64_t s32_video_pace_layers, s32_video_pace_mix;

          static uint64_t video_microseconds(void)
          {
          \tstruct timespec moment;

          \tclock_gettime(CLOCK_MONOTONIC, &moment);
          \treturn (uint64_t)moment.tv_sec * 1000000u + (uint64_t)moment.tv_nsec / 1000u;
          }
          #endif

          void s32_video_draw_frame(void)
          """
          # The layers and the mix are one pass over the rows now, so there is no layers-versus-mixing
          # split left to measure. What is worth separating instead is the setup (working out each
          # layer's registers, clips and scroll, plus the backdrop) from the row pass that does the work.
          DRAW_OLD = """\t\ts32_workers_rows(draw_and_mix_rows, NULL, video.visible.top, video.visible.bottom);
          """
          DRAW_NEW = """#ifdef __vita__
          \t\t{
          \t\t\tconst uint64_t rows_start = video_microseconds();

          \t\t\ts32_workers_rows(draw_and_mix_rows, NULL, video.visible.top, video.visible.bottom);
          \t\t\ts32_video_pace_layers += video_microseconds() - rows_start;
          \t\t}
          #else
          \t\ts32_workers_rows(draw_and_mix_rows, NULL, video.visible.top, video.visible.bottom);
          #endif
          """

          if "s32_video_pace_layers" in s:
              done.append("video timing: already in")
          elif s.count("void s32_video_draw_frame(void)\n") != 1 or s.count(DRAW_OLD) != 1:
              problems.append("video timing: draw_frame x%d, the layers/mix lines x%d (wanted 1 each)"
                              % (s.count("void s32_video_draw_frame(void)\n"), s.count(DRAW_OLD)))
          else:
              s = s.replace("void s32_video_draw_frame(void)\n", CLOCK, 1)
              s = s.replace(DRAW_OLD, DRAW_NEW, 1)
              done.append("video timing: added")

          # --- 4. tile_pen without a divide on the path that never needs one -------------------------------
          # tile_pen runs once per tilemap pixel and its modulo is a call to __aeabi_uidiv (the Cortex-A9 has no
          # divide instruction). The packed assets hold 0x8000 tiles, a power of two, so the wrap is an AND.
          # A mask is also the only form that is always fast: page_pixel builds tile as bank << 13 | 13 bits,
          # so a bank of 4 or more puts tile past the count, and a plain `tile < count` guard would fall back
          # to the divide on every one of those pixels. The checks load a set of their own size, which may be
          # any count, and keep the modulo.
          OLD_TP = "\treturn video.graphics.tile_pens[tile % video.graphics.tile_count][y * 16 + x];\n"
          NEW_TP = ("\tconst uint32_t count = video.graphics.tile_count;\n"
                    "\t/* the board's set is 0x8000 tiles, a power of two: the wrap is an AND, not __aeabi_uidiv */\n"
                    "\tconst uint32_t index = (count & (count - 1u)) == 0u ? (tile & (count - 1u)) : tile % count;\n"
                    "\n"
                    "\treturn video.graphics.tile_pens[index][y * 16 + x];\n")

          if "the wrap is an AND, not __aeabi_uidiv" in s:
              done.append("tile_pen: already in")
          elif s.count(OLD_TP) != 1:
              problems.append("tile_pen: the return was found %d times (wanted 1)" % s.count(OLD_TP))
          else:
              s = s.replace(OLD_TP, NEW_TP, 1)
              done.append("tile_pen: added")
          for line in done:
              print("  " + line)
          if problems:
              print("video.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              for i, line in enumerate(s.split("\n"), 1):
                  if "sprite.indirect" in line or "sign_extend(sprite_word(entry + 4)" in line or "0xffff" in line:
                      print("%5d: %s" % (i, line.strip()[:110]))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              io.open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/video.c: the Vita edits are in")
          else:
              print("runtime/src/video.c: the Vita edits were already in")
          VIDEO_EDITS
          python3 - <<'MACHINE_EDITS'
          import io, re, sys

          path = "runtime/src/machine.c"
          s = io.open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")

          # The decompiled game reaches the board through these six, and every one decodes the address before it
          # knows where it goes. "the game's own code" in the Vita's log is 15.8 ms a frame and nothing says how
          # much of it is these: counting them is a cycle each and tells whether the dispatch is worth attacking
          READS = ["uint8_t s32_read8(uint32_t address)", "uint16_t s32_read16(uint32_t address)",
                   "uint32_t s32_read32(uint32_t address)"]
          WRITES = ["void s32_write8(uint32_t address, uint8_t data)", "void s32_write16(uint32_t address, uint16_t data)",
                    "void s32_write32(uint32_t address, uint32_t data)"]

          if "s32_io_reads" in s:
              print("  board i/o counters: already in")
          else:
              problems = []
              for signature in READS + WRITES:
                  if s.count(signature + "\n{\n") != 1:
                      problems.append("%s was found %d times (wanted 1)" % (signature, s.count(signature + "\n{\n")))
              if problems:
                  print("machine.c does not look as expected:")
                  for p in problems:
                      print("  -", p)
                  sys.exit(1)
              s = s.replace(READS[0] + "\n{\n",
                            "/* (the Vita's log: how often the game reaches the board, and which way) */\n"
                            "uint64_t s32_io_reads, s32_io_writes;\n\n" + READS[0] + "\n{\n\ts32_io_reads++;\n", 1)
              for signature in READS[1:]:
                  s = s.replace(signature + "\n{\n", signature + "\n{\n\ts32_io_reads++;\n", 1)
              for signature in WRITES:
                  s = s.replace(signature + "\n{\n", signature + "\n{\n\ts32_io_writes++;\n", 1)
              print("  board i/o counters: added")

          s = s.replace("\n", nl)
          if s != orig:
              io.open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/machine.c: the Vita edits are in")
          else:
              print("runtime/src/machine.c: the Vita edits were already in")
          MACHINE_EDITS
          python3 - <<'SOUND_CPU_EDITS'
          import io, sys

          path = "runtime/src/sound_cpu.c"
          s = io.open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")
          done, problems = [], []

          def swap(name, old, new):
              global s
              if s.count(old) != 1:
                  problems.append("%s: the text to change was found %d times (wanted 1)" % (name, s.count(old)))
                  return
              s = s.replace(old, new, 1)
              done.append(name + ": added")

          # --- 1. board_time without a divide ---------------------------------------------------------------
          # The board is 20 MHz and the sound clock 8 MHz: exactly 5/2. The Cortex-A9 has no divide instruction,
          # so a 64-bit divide is a call to __aeabi_uldivmod, and z80_block runs board_time for EVERY basic block
          # of the sound program -- thousands of times a frame, on core 0, inside the game's own time.
          OLD_BT = """static uint64_t board_time(uint64_t cycles)
          {
          \treturn cycles * S32_CPU_CLOCK / S32_SOUND_CLOCK;
          }
          """
          NEW_BT = """_Static_assert(S32_CPU_CLOCK * 2u == S32_SOUND_CLOCK * 5u, "board_time: the clocks are no longer 5/2");

          static uint64_t board_time(uint64_t cycles)
          {
          \t/* 20 MHz over 8 MHz is exactly 5/2, so this is a multiply and a shift and not a 64-bit divide. The
          \t   Cortex-A9 has no divide instruction: the divide this replaces was a call to __aeabi_uldivmod, and
          \t   z80_block runs it for every basic block of the sound program. Exact while cycles * 5 fits in 64
          \t   bits, which at the Z80's 133,333 cycles a frame is a few hundred thousand years. */
          \treturn (cycles * 5u) >> 1;
          }
          """
          if "the clocks are no longer 5/2" in s:
              done.append("board_time: already in")
          else:
              swap("board_time", OLD_BT, NEW_BT)

          # --- 2. z80_block works out the time once a turn round the loop, not twice ------------------------
          # z80.clock cannot change between the board_time at the top of an iteration and the break below it,
          # so the value the loop last computed is the one the store wants.
          OLD_BLK = """void z80_block(int cycles, int fetches)
          {
          \tfor (;;)
          \t{
          \t\tsound_chips_timers_due(board_time(z80.clock));
          \t\tif (!z80.interrupts || z80.after_ei || !z80.line)
          \t\t\tbreak;
          \t\tz80.interrupts = false;
          \t\tz80.clock += INTERRUPT_CYCLES;
          \t\tz80.refresh++;
          \t\tsound_irq();
          \t}
          \tz80.after_ei = false;
          \ts32_board.sound_cycles = board_time(z80.clock);
          """
          NEW_BLK = """void z80_block(int cycles, int fetches)
          {
          \tuint64_t now;

          \tfor (;;)
          \t{
          \t\tnow = board_time(z80.clock);
          \t\tsound_chips_timers_due(now);
          \t\tif (!z80.interrupts || z80.after_ei || !z80.line)
          \t\t\tbreak;
          \t\tz80.interrupts = false;
          \t\tz80.clock += INTERRUPT_CYCLES;
          \t\tz80.refresh++;
          \t\tsound_irq();
          \t}
          \tz80.after_ei = false;
          \ts32_board.sound_cycles = now;    /* (the break is before anything moves z80.clock: this is that time) */
          """
          if "uint64_t now;" in s:
              done.append("z80_block: already in")
          else:
              swap("z80_block", OLD_BLK, NEW_BLK)

          # --- 3. on_time_passes converts the time once, not twice ------------------------------------------
          OLD_TP = """\t\tif (z80.clock < z80_time(until))
          \t\t\tz80.clock = z80_time(until);
          """
          NEW_TP = """\t\t{
          \t\t\tconst uint64_t start = z80_time(until);    /* (once: this one is still a divide) */

          \t\t\tif (z80.clock < start)
          \t\t\t\tz80.clock = start;
          \t\t}
          """
          if "this one is still a divide" in s:
              done.append("on_time_passes: already in")
          else:
              swap("on_time_passes", OLD_TP, NEW_TP)


          # --- 4. how long the sound program itself holds core 0 ------------------------------------------
          # s32_wait calls time_passes in the middle of the game's frame, and on_time_passes runs the decompiled
          # sound program until the Z80 catches up. That time is spent on core 0 and lands in the Vita log's
          # "game's own code", not in its "sound". Nothing has ever measured it, and it may be a large part of
          # the 15.4 ms. The call count is reported too, so the timer's own overhead can be judged.
          CLOCK = """#ifdef __vita__
          #include <time.h>

          /* (the Vita's log: the sound program's own time on core 0, in microseconds, and how often it is asked
             to catch up; the port reads both and puts them back to nothing every time it writes a line) */
          uint64_t s32_sound_program_us;
          uint32_t s32_sound_program_calls;

          static uint64_t sound_microseconds(void)
          {
          \tstruct timespec moment;

          \tclock_gettime(CLOCK_MONOTONIC, &moment);
          \treturn (uint64_t)moment.tv_sec * 1000000u + (uint64_t)moment.tv_nsec / 1000u;
          }

          static void on_time_passes_work(uint64_t until);

          static void on_time_passes(uint64_t until)
          {
          \tconst uint64_t start = sound_microseconds();

          \ton_time_passes_work(until);
          \ts32_sound_program_us += sound_microseconds() - start;
          \ts32_sound_program_calls++;
          }

          static void on_time_passes_work(uint64_t until)
          #else
          static void on_time_passes(uint64_t until)
          #endif
          """
          OLD_SIG = "static void on_time_passes(uint64_t until)\n"

          if "s32_sound_program_us" in s:
              done.append("sound program timing: already in")
          elif s.count(OLD_SIG) != 1:
              problems.append("sound program timing: on_time_passes was found %d times (wanted 1)" % s.count(OLD_SIG))
          else:
              s = s.replace(OLD_SIG, CLOCK, 1)
              done.append("sound program timing: added")
          for line in done:
              print("  " + line)
          if problems:
              print("sound_cpu.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              for i, line in enumerate(s.split("\n"), 1):
                  if "board_time" in line or "z80_time" in line:
                      print("%5d: %s" % (i, line.strip()[:110]))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              io.open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/sound_cpu.c: the Vita edits are in")
          else:
              print("runtime/src/sound_cpu.c: the Vita edits were already in")
          SOUND_CPU_EDITS

      - name: Check that the Vita code is in the source (fails if not)
        run: |
          echo "main.c: audio_resampler x$(grep -c audio_resampler ports/sdl2/main.c), gxm x$(grep -c gxm ports/sdl2/main.c), workers.txt x$(grep -c workers.txt ports/sdl2/main.c), frameskip x$(grep -c vita_frame_skip ports/sdl2/main.c)"
          echo "tasks.c: VITA_TASK_THREADS x$(grep -c VITA_TASK_THREADS runtime/src/tasks.c), VITA_TASK_COUNTER x$(grep -c VITA_TASK_COUNTER runtime/src/tasks.c)"
          echo "workers.c: orunners_vita_pin x$(grep -c orunners_vita_pin runtime/src/workers.c)"
          echo "vita.cmake: $(grep -o 'ORUNNERS_VITA_VERSION "[0-9.]*"' ports/vita/vita.cmake), cores block x$(grep -c 'appended by the build' ports/vita/vita.cmake)"
          grep -q audio_resampler ports/sdl2/main.c
          grep -q gxm ports/sdl2/main.c
          grep -q workers.txt ports/sdl2/main.c
          grep -q vita_frame_skip ports/sdl2/main.c
          grep -q VITA_TASK_THREADS_PINNED runtime/src/tasks.c
          grep -q VITA_TASK_COUNTER runtime/src/tasks.c
          grep -q orunners_vita_pin runtime/src/workers.c
          grep -q VITA_PIN_LIBS ports/vita/vita.cmake
          test -f ports/vita/vita_pin.c

      - name: Show the compiler's CPU defaults
        run: |
          # (which CPU, FPU and float ABI the SDK's compiler builds for when no flag says: in the logs artifact as cpu.log)
          { arm-vita-eabi-gcc -Q --help=target | grep -E '^ +-(mcpu|mtune|march|mfpu|mfloat-abi)=' ; arm-vita-eabi-gcc -dM -E - </dev/null | grep -E '__ARM_NEON|__ARM_ARCH |__ARM_PCS_VFP|__ARM_FP ' ; } 2>&1 | tee cpu.log || true

      - name: Configure
        run: |
          cmake -S . -B build/vita -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DORUNNERS_VITA=ON -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          cmake --build build/vita --target OutRunners.vpk -- -v 2>&1 | tee build.log

      - name: Count the divide libcalls left in the build
        run: |
          # The Cortex-A9 has no divide instruction, so every / and % by a non-constant is a
          # call. These counts say whether the hot ones really went.
          for o in build/vita/CMakeFiles/s32runtime.dir/runtime/src/sound_cpu.c.obj \
                   build/vita/CMakeFiles/s32runtime.dir/runtime/src/video.c.obj; do
            if [ -f "$o" ]; then
              echo "$(basename $o): $(arm-vita-eabi-objdump -d "$o" 2>/dev/null \
                | grep -cE 'bl.*__aeabi_(uldivmod|ldivmod|uidiv|idiv)') divide libcalls"
            else
              echo "$(basename $o): not found (LTO may have renamed it)"
            fi
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-build-logs
          path: |
            configure.log
            build.log
            cpu.log
          if-no-files-found: ignore

      - name: Make the symbol list (names the addresses of a crash dump)
        if: always()
        run: |
          if [ -f build/bin/OutRunners ]; then arm-vita-eabi-nm -n -C build/bin/OutRunners > symbols.txt; fi

      - name: Keep the symbol list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-symbols
          path: symbols.txt
          if-no-files-found: ignore

      - name: Keep the VPK
        uses: actions/upload-artifact@v4
        with:
          name: OutRunners-vita-vpk
          path: build/vita/OutRunners.vpk
