# Builds OutRunners for the PlayStation Vita (VitaSDK) on GitHub's servers: no ROM, no assets, only the game.
# Run it by hand: the Actions tab > "Build Vita VPK" > Run workflow. Its VPK and its build log are in the
# run's Artifacts when it ends (the log also when the build fails).
name: Build Vita VPK

on:
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      VITASDK: /home/runner/vitasdk    # (the install script makes it itself, and stops if it is already there)
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install VitaSDK
        run: |
          set -x
          git clone --depth 1 https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          ls "$VITASDK/bin" | head -20
          # (the only library the game needs beyond the SDK's own; it asks "Proceed? [Y/n]", which nobody can
          # answer here: so "y" is sent, and pacman's own --noconfirm is the second try)
          printf 'y\n' | vdpm install sdl2 || vdpm pacman -- -S --noconfirm sdl2
          ls "$VITASDK/arm-vita-eabi/lib" | grep -i sdl2 || echo "no SDL2 library found"

      - name: Apply the Vita changes to the source
        run: |
          # Every edit is made by the lines' text and only if it is not in yet, so it does not matter whether the
          # repository has the sources as they were, or with an earlier version of these edits
          mkdir -p ports/vita
          # vita_pin.c (the cores, the clocks report): a file of this build's own
          cat > ports/vita/vita_pin.c <<'VITA_PIN_C'
          /* Name:        vita_pin.c
           * Description: the PlayStation Vita build's cores: which of the three an app has each thread runs on, and a report
           *              of the clocks for the log (written by the build, beside vita_runtime.c)
           */
          #ifdef __vita__

          #include <stdio.h>
          #include <psp2/power.h>

          #ifdef ORUNNERS_VITA_AFFINITY
          /* (in the SDK's stub libraries: vita.cmake finds which and links it) */
          int sceKernelChangeThreadCpuAffinityMask(int thid, int cpuAffinityMask);
          int sceKernelGetThreadId(void);
          #endif

          /* The calling thread to the cores of 'mask': 0x10000 core 0, 0x20000 core 1, 0x40000 core 2 (an app has these three;
             the system keeps the fourth). The game and its tasks run on core 0, the video's workers on 1 and 2 */
          void orunners_vita_pin(int mask)
          {
          #ifdef ORUNNERS_VITA_AFFINITY
          	sceKernelChangeThreadCpuAffinityMask(sceKernelGetThreadId(), mask);
          #else
          	(void)mask;
          #endif
          }

          /* What the log says about the machine, once the log is open */
          void orunners_vita_report(void)
          {
          	fprintf(stderr, "vita: cpu %d MHz, bus %d MHz, gpu %d MHz, cores pinned: %s\n", scePowerGetArmClockFrequency(),
          		scePowerGetBusClockFrequency(), scePowerGetGpuClockFrequency(),
          #ifdef ORUNNERS_VITA_AFFINITY
          		"yes"
          #else
          		"no"
          #endif
          		);
          }

          /* The game's own thread, the one that starts the program, runs on core 0 */
          __attribute__((constructor)) static void orunners_vita_pin_main(void)
          {
          	orunners_vita_pin(0x10000);
          }

          #endif
          VITA_PIN_C
          # vita.cmake: the cores block, appended once; and the version the Vita shows
          if ! grep -q "VITA_PIN_LIBS" ports/vita/vita.cmake; then
          cat >> ports/vita/vita.cmake <<'VITA_CMAKE_BLOCK'

          # --- VITA_PIN_LIBS: cores, and the clocks report (appended by the build, once) ---
          target_sources(OutRunners PRIVATE ports/vita/vita_pin.c)
          # The calls that pin a thread to a core (the game on core 0, the video's workers on 1 and 2) are in one of the SDK's
          # stub libraries: find which, link it, and say so; where there is none the game builds and runs without pinning
          set(VITA_PIN_LIBS "")
          set(VITA_PIN_FOUND TRUE)
          file(GLOB VITA_STUBS "$ENV{VITASDK}/arm-vita-eabi/lib/libSce*_stub.a")
          foreach(symbol sceKernelChangeThreadCpuAffinityMask sceKernelGetThreadId)
          	set(symbol_library "")
          	foreach(stub ${VITA_STUBS})
          		if(NOT symbol_library)
          			execute_process(COMMAND "$ENV{VITASDK}/bin/arm-vita-eabi-nm" "${stub}" OUTPUT_VARIABLE stub_symbols ERROR_QUIET)
          			if(stub_symbols MATCHES " ${symbol}\n")
          				get_filename_component(symbol_library "${stub}" NAME_WE)
          				string(REGEX REPLACE "^lib" "" symbol_library "${symbol_library}")
          			endif()
          		endif()
          	endforeach()
          	if(symbol_library)
          		list(APPEND VITA_PIN_LIBS ${symbol_library})
          	else()
          		set(VITA_PIN_FOUND FALSE)
          	endif()
          endforeach()
          if(VITA_PIN_FOUND)
          	list(REMOVE_DUPLICATES VITA_PIN_LIBS)
          	message(STATUS "Vita: pinning threads to cores, with ${VITA_PIN_LIBS}")
          	target_compile_definitions(OutRunners PRIVATE ORUNNERS_VITA_AFFINITY)
          	target_link_libraries(OutRunners PRIVATE ${VITA_PIN_LIBS})
          else()
          	message(STATUS "Vita: the calls that pin threads to cores were not found in the SDK: no pinning")
          endif()
          VITA_CMAKE_BLOCK
          fi
          if ! grep -q "VITA_LTO" ports/vita/vita.cmake; then
          cat >> ports/vita/vita.cmake <<'VITA_LTO_BLOCK'

          # --- VITA_LTO: the whole game built as one unit (appended by the build, once) ---
          # "the game's own code" is 15.4 ms of a 41 ms frame and it is not board dispatch: the log counts only about
          # 480 reads and writes a frame, which is microseconds. It is the decompiled code itself, and decompiled code
          # is thousands of small functions spread over many files, which is exactly what the linker can do something
          # about. Added to the targets rather than to CMAKE_C_FLAGS, because the toolchain keeps -Wl,-q in there and
          # vita_create_self needs it.
          foreach(lto_target s32runtime orunners_game_console orunners_sound OutRunners)
          	if(TARGET ${lto_target})
          		target_compile_options(${lto_target} PRIVATE -flto -ffat-lto-objects)
          	endif()
          endforeach()
          target_link_options(OutRunners PRIVATE -flto -O3)
          message(STATUS "Vita: building the game with link-time optimisation")
          VITA_LTO_BLOCK
          fi
          sed -i -E 's/(ORUNNERS_VITA_VERSION ")[0-9]+[.][0-9]+(")/\1''01.02''\2/' ports/vita/vita.cmake
          python3 - <<'CMAKE_EDITS'
          import re, sys

          path = "CMakeLists.txt"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")
          problems = []

          # 1. the option, before the first option() of the file
          if "option(ORUNNERS_VITA" not in s:
              m = re.search(r"^option\(", s, re.M)
              if m:
                  s = s[:m.start()] + 'option(ORUNNERS_VITA "Build the game for the PlayStation Vita (VitaSDK, ports/vita)" OFF)\n\n' + s[m.start():]
              else:
                  problems.append("no option( line to put ORUNNERS_VITA before")

          # 2. the computer-only tools (the maker, the headless runs) are not for the Vita
          if "NOT ORUNNERS_VITA" not in s:
              s, n = re.subn(r"(NOT ORUNNERS_ANBERNIC)( AND NOT ANDROID)", r"\1 AND NOT ORUNNERS_VITA\2", s)
              if n == 0:
                  problems.append("no 'NOT ORUNNERS_ANBERNIC AND NOT ANDROID' condition found")

          # 3. the device dispatch: the Vita's file after the Anbernic's
          if "ports/vita/vita.cmake" not in s:
              s, n = re.subn(r"(elseif\(ORUNNERS_ANBERNIC\)\s*\n[ \t]*include\([^)\n]*anbernic\.cmake\)[ \t]*\n)",
                             r"\1\telseif(ORUNNERS_VITA)\n\t\tinclude(${CMAKE_SOURCE_DIR}/ports/vita/vita.cmake)\n", s)
              if n == 0:
                  problems.append("no 'elseif(ORUNNERS_ANBERNIC) include(...anbernic.cmake)' dispatch found")

          # 4. the desktop's SDL2 lookup is not for the Vita
          if "ORUNNERS_ANBERNIC OR ORUNNERS_VITA" not in s:
              s, n = re.subn(r"if\(ORUNNERS_ANBERNIC OR ORUNNERS_SWITCH OR ANDROID\)", "if(ORUNNERS_ANBERNIC OR ORUNNERS_VITA OR ORUNNERS_SWITCH OR ANDROID)", s)
              if n == 0:
                  problems.append("no 'if(ORUNNERS_ANBERNIC OR ORUNNERS_SWITCH OR ANDROID)' SDL2 condition found")

          if problems:
              print("CMakeLists.txt does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("the lines that name the devices, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if "ORUNNERS_ANBERNIC" in line or "ORUNNERS_SWITCH" in line or "ORUNNERS_VITA" in line:
                      print("%5d: %s" % (i, line))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("CMakeLists.txt: the Vita edits are in")
          else:
              print("CMakeLists.txt: the Vita edits were already in")
          CMAKE_EDITS
          python3 - <<'MAIN_EDITS'
          import re, sys

          path = "ports/sdl2/main.c"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")

          def norm(t):
              return re.sub(r"\s+", " ", t)

          def pattern(old):
              body = r"\s+".join(re.escape(t) for t in old.split())
              return re.compile(r"(?m)^[ \t]*" + body + (r"[ \t]*\n" if old.endswith("\n") else ""))

          # (name, a piece of the NEW text that says the edit is in, the OLD text it replaces, the NEW text)
          EDITS = []
          def edit(name, marker, old, new):
              EDITS.append((name, marker, old, new))

          edit("folder and includes", re.compile(r"#\s*define\s+VITA_FOLDER\b"),
          '''#if defined(ORUNNERS_HANDHELD) && !defined(_WIN32) && !defined(__SWITCH__)
          #include <unistd.h>        /* fsync: the log on the card as it is written */
          #endif
          ''','''#ifdef __vita__
          #include <sys/stat.h>      /* mkdir */
          #define VITA_FOLDER "ux0:data/OutRunners"    /* the game's folder on the memory card: its assets pack, what it writes */
          #endif
          #if defined(ORUNNERS_HANDHELD) && !defined(_WIN32) && !defined(__SWITCH__) && !defined(__vita__)
          #include <unistd.h>        /* fsync: the log on the card as it is written */
          #endif
          ''')

          edit("video workers", '#elif defined(__vita__) #define VIDEO_WORKERS',
          '''#else
          #define VIDEO_WORKERS       SDL_min(SDL_GetCPUCount() - 1, 3)''','''#elif defined(__vita__)
          #define VIDEO_WORKERS       2          /* (the Vita's cores beside the game's: tune it with outrunners.log's pace) */
          #else
          #define VIDEO_WORKERS       SDL_min(SDL_GetCPUCount() - 1, 3)''')

          edit("fsync", '!defined(__SWITCH__) && !defined(__vita__) fsync(fileno(stderr));',
          '''	fflush(stderr);
          #if !defined(_WIN32) && !defined(__SWITCH__)
          	fsync(fileno(stderr));''','''	fflush(stderr);
          #if !defined(_WIN32) && !defined(__SWITCH__) && !defined(__vita__)
          	fsync(fileno(stderr));''')

          edit("saves folder", re.compile(r"return\s+SDL_strdup\(\s*VITA_FOLDER", re.I),
          '''	return SDL_strdup(SWITCH_FOLDER "/");
          #elif defined(__ANDROID__)''','''	return SDL_strdup(SWITCH_FOLDER "/");
          #elif defined(__vita__)
          	mkdir(VITA_FOLDER, 0777);
          	return SDL_strdup(VITA_FOLDER "/");
          #elif defined(__ANDROID__)''')

          edit("log file", re.compile(r"freopen\(\s*VITA_FOLDER", re.I),
          '''#ifdef __ANDROID__
          	/* (what the game says goes to outrunners.log in the app's folder''','''#ifdef __vita__
          	/* (what the game says, failures included, goes to outrunners.log in its folder on the card: the Vita has no
          	   console to read it on) */
          	mkdir(VITA_FOLDER, 0777);
          	freopen(VITA_FOLDER "/outrunners.log", "w", stderr);
          	fprintf(stderr, "OutRunners: starting\\n");
          #endif
          #ifdef __ANDROID__
          	/* (what the game says goes to outrunners.log in the app's folder''')

          edit("window", re.compile(r"defined\(\s*__vita__\s*\)[^#]{0,300}?SDL_CreateWindow", re.S),
          '''#elif defined(ORUNNERS_HANDHELD)
          	window = SDL_CreateWindow(TITLE, SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 640, 480, SDL_WINDOW_FULLSCREEN_DESKTOP);''','''#elif defined(__vita__)
          	/* (the Vita's screen, 960 x 544: the system shows the window as all of it) */
          	window = SDL_CreateWindow(TITLE, 0, 0, 960, 544, SDL_WINDOW_SHOWN);
          #elif defined(ORUNNERS_HANDHELD)
          	window = SDL_CreateWindow(TITLE, SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 640, 480, SDL_WINDOW_FULLSCREEN_DESKTOP);''')

          edit("audio helper", 'queue_resampled',
          '''static SDL_AudioDeviceID audio;
          ''','''static SDL_AudioDeviceID audio;
          #ifdef __vita__
          static SDL_AudioStream *audio_resampler;    /* the mark that the mix's rate is not the one the device took (audio open, below) */

          /* The mix's rate (the chips' 55555 Hz) to the 48000 the Vita's audio takes. SDL's own stream costs about
             2 ms of every frame on this machine, more than the sound chips themselves cost to run, and the log said
             so ("queueing it"); this walks the mix with a 16.16 step and interpolates between the two samples it
             falls between, which a board's mix does not suffer from. The step is kept between frames, with the
             frame's last sample, so the two meet without a click */
          #define RESAMPLE_RATE 48000

          static uint32_t resample_phase;      /* where the next sample out falls in the mix, 16.16 */
          static int16_t resample_last[2];     /* the last sample of the frame before */
          static bool resample_going;          /* resample_last holds one */

          static void queue_resampled(const int16_t *samples, size_t frames)
          {
          	static int16_t out[4096];        /* (a frame of the mix is about 926 samples, which make about 800) */
          	const size_t room = sizeof(out) / sizeof(out[0]) / 2;
          	const uint32_t step = (uint32_t)(((uint64_t)sound_chips_mix_rate() << 16) / RESAMPLE_RATE);
          	uint32_t phase = resample_phase;
          	size_t made = 0;

          	if (frames == 0)
          		return;
          	if (!resample_going)
          	{
          		resample_last[0] = samples[0];
          		resample_last[1] = samples[1];
          		resample_going = true;
          	}
          	while ((size_t)(phase >> 16) < frames && made < room)
          	{
          		const size_t index = phase >> 16;
          		const int32_t between = (int32_t)(phase & 0xffff);
          		const int16_t *before = index == 0 ? resample_last : &samples[(index - 1) * 2];
          		const int16_t *after = &samples[index * 2];

          		out[made * 2] = (int16_t)(before[0] + (((int32_t)after[0] - before[0]) * between >> 16));
          		out[made * 2 + 1] = (int16_t)(before[1] + (((int32_t)after[1] - before[1]) * between >> 16));
          		made++;
          		phase += step;
          	}
          	/* what is left of the step goes on into the next frame (nothing, if the buffer above ran out first) */
          	resample_phase = (size_t)(phase >> 16) >= frames ? phase - (uint32_t)(frames << 16) : 0;
          	resample_last[0] = samples[(frames - 1) * 2];
          	resample_last[1] = samples[(frames - 1) * 2 + 1];
          	if (made > 0)
          		SDL_QueueAudio(audio, out, (Uint32)(made * 2 * sizeof(int16_t)));
          }
          #endif

          /* The mix to the device's queue (resampled on the Vita, where the device would not take the mix's rate) */
          static void queue_audio(const void *data, Uint32 bytes)
          {
          #ifdef __vita__
          	if (audio_resampler)
          	{
          		queue_resampled((const int16_t *)data, bytes / (2 * sizeof(int16_t)));
          		return;
          	}
          #endif
          	SDL_QueueAudio(audio, data, bytes);
          }
          ''')

          edit("queue the mix", 'queue_audio(mix, (Uint32)(count * 2 * sizeof(int16_t)));',
          '''		SDL_QueueAudio(audio, mix, (Uint32)(count * 2 * sizeof(int16_t)));''','''		queue_audio(mix, (Uint32)(count * 2 * sizeof(int16_t)));''')

          edit("audio open", 'audio_resampler = SDL_NewAudioStream(',
          '''	audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          	if (audio)
          		SDL_PauseAudioDevice(audio, 0);
          ''','''	audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          #ifdef __vita__
          	if (!audio)
          	{
          		/* (the Vita's audio takes 48000 Hz and a few lower rates, not the chips' own: the mix goes through a
          		   stream that takes it to 48000) */
          		wanted.freq = 48000;
          		audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          		if (audio)
          			audio_resampler = SDL_NewAudioStream(AUDIO_S16SYS, 2, (int)sound_chips_mix_rate(), AUDIO_S16SYS, 2, 48000);
          		if (audio && !audio_resampler)
          		{
          			SDL_CloseAudioDevice(audio);
          			audio = 0;
          		}
          	}
          #endif
          	if (audio)
          		SDL_PauseAudioDevice(audio, 0);
          ''')

          edit("audio close", 'SDL_FreeAudioStream(audio_resampler);',
          '''	if (audio)
          		SDL_CloseAudioDevice(audio);
          ''','''	if (audio)
          		SDL_CloseAudioDevice(audio);
          #ifdef __vita__
          	if (audio_resampler)
          		SDL_FreeAudioStream(audio_resampler);
          #endif
          ''')

          edit("renderer", 'SDL lists the Vita',
          '''	renderer = window ? SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED) : NULL;
          ''','''#ifdef __vita__
          	/* SDL lists the Vita's GLES2 renderer before its GXM one, and the GLES2 one compiles its shaders as it runs,
          	   with libshacccg.suprx: a file of the Vita's firmware that not every setup has (and Vita3K has not). The GXM
          	   renderer has its shaders built in and needs nothing */
          	renderer = NULL;
          	for (int driver = 0; window && !renderer && driver < SDL_GetNumRenderDrivers(); driver++)
          	{
          		SDL_RendererInfo driver_info;

          		if (SDL_GetRenderDriverInfo(driver, &driver_info) == 0 && driver_info.name
          			&& (SDL_strstr(driver_info.name, "gxm") || SDL_strstr(driver_info.name, "GXM")))
          			renderer = SDL_CreateRenderer(window, driver, 0);
          	}
          	if (window && !renderer)
          		renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED);
          #else
          	renderer = window ? SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED) : NULL;
          #endif
          ''')

          edit("frame skip variable", 'static int vita_frame_skip;',
          """#ifdef ORUNNERS_HANDHELD
          static uint64_t pace_video, pace_showing;    /* a handheld's log: the frames' time drawing them, showing them */
          #endif
          ""","""#ifdef ORUNNERS_HANDHELD
          static uint64_t pace_video, pace_showing;    /* a handheld's log: the frames' time drawing them, showing them */
          #endif
          #ifdef __vita__
          static int vita_frame_skip;    /* frameskip.txt: the frames not drawn between two that are (0: all are drawn) */
          #endif
          """)

          edit("frame skip", 'frames not drawn: frameskip.txt',
          """#ifdef ORUNNERS_HANDHELD
          	const uint64_t start = SDL_GetPerformanceCounter();
          	uint64_t drawn;
          ""","""#ifdef __vita__
          	{
          		static unsigned frame_count;

          		if (vita_frame_skip > 0 && frame_count++ % ((unsigned)vita_frame_skip + 1) != 0)
          			return;    /* (frames not drawn: frameskip.txt) */
          	}
          #endif
          #ifdef ORUNNERS_HANDHELD
          	const uint64_t start = SDL_GetPerformanceCounter();
          	uint64_t drawn;
          """)

          edit("workers file", 'workers.txt',
          """	s32_workers_start(VIDEO_WORKERS);
          ""","""#ifdef __vita__
          	/* (two small files in the game's folder try the Vita's speed without a new build: workers.txt, the video's
          	   threads beside the game's, 0 to 3; frameskip.txt, the frames not drawn between two that are, 0 to 3) */
          	{
          		int value, workers = VIDEO_WORKERS;
          		FILE *file = fopen(VITA_FOLDER "/workers.txt", "r");

          		if (file)
          		{
          			if (fscanf(file, "%d", &value) == 1 && value >= 0 && value <= 3)
          				workers = value;
          			fclose(file);
          		}
          		file = fopen(VITA_FOLDER "/frameskip.txt", "r");
          		if (file)
          		{
          			if (fscanf(file, "%d", &value) == 1 && value >= 0 && value <= 3)
          				vita_frame_skip = value;
          			fclose(file);
          		}
          		s32_workers_start(workers);
          		fprintf(stderr, "frameskip: %d\\n", vita_frame_skip);
          	}
          #else
          	s32_workers_start(VIDEO_WORKERS);
          #endif
          """)

          edit("clock report", 'orunners_vita_report();',
          """	fprintf(stderr, "video: %d threads beside the game's\\n", s32_workers_count());
          ""","""	fprintf(stderr, "video: %d threads beside the game's\\n", s32_workers_count());
          #ifdef __vita__
          	{
          		extern void orunners_vita_report(void);    /* (ports/vita/vita_pin.c) */

          		orunners_vita_report();
          	}
          #endif
          """)

          # --- the Vita's timing (Vita only): where a frame's time goes, a second line in the log after the pace line ---
          edit("timing variables", 'pace_sound',
          """static uint64_t pace_video, pace_showing;""",
          """#ifdef __vita__
          static uint64_t pace_controls, pace_sound, pace_queue, pace_extras;    /* the Vita's log: the controls, the sound, queueing it, the frame's end in all */
          static uint64_t pace_sprites;    /* and the board's sprites, drawn while the frame runs: pace_video does not count them */
          #endif
          static uint64_t pace_video, pace_showing;""")

          edit("timing controls", 'on_controls_update_work',
          """static void on_controls_update(void)""",
          """#ifdef __vita__
          static void on_controls_update_work(void);

          static void on_controls_update(void)
          {
          	const uint64_t controls_start = SDL_GetPerformanceCounter();

          	on_controls_update_work();
          	pace_controls += SDL_GetPerformanceCounter() - controls_start;
          }

          static void on_controls_update_work(void)
          #else
          static void on_controls_update(void)
          #endif""")

          edit("timing frame's end start", 'done_start',
          """log_pace(true);""",
          """	log_pace(true);
          #ifdef __vita__
          	const uint64_t done_start = SDL_GetPerformanceCounter();
          #endif""")

          edit("timing sound", 'sound_start',
          """if (s32_board.time_passes)
          		s32_board.time_passes(s32_board.cycles);
          	sound_chips_end_frame(s32_board.cycles);""",
          """#ifdef __vita__
          	const uint64_t sound_start = SDL_GetPerformanceCounter();
          #endif
          	if (s32_board.time_passes)
          		s32_board.time_passes(s32_board.cycles);
          	sound_chips_end_frame(s32_board.cycles);
          #ifdef __vita__
