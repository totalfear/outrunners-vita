# Builds OutRunners for the PlayStation Vita (VitaSDK) on GitHub's servers: no ROM, no assets, only the game.
# Run it by hand: the Actions tab > "Build Vita VPK" > Run workflow. Its VPK and its build log are in the
# run's Artifacts when it ends (the log also when the build fails).
name: Build Vita VPK

on:
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      VITASDK: /home/runner/vitasdk    # (the install script makes it itself, and stops if it is already there)
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install VitaSDK
        run: |
          set -x
          git clone --depth 1 https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          ls "$VITASDK/bin" | head -20
          # (the only library the game needs beyond the SDK's own; it asks "Proceed? [Y/n]", which nobody can
          # answer here: so "y" is sent, and pacman's own --noconfirm is the second try)
          printf 'y\n' | vdpm install sdl2 || vdpm pacman -- -S --noconfirm sdl2
          ls "$VITASDK/arm-vita-eabi/lib" | grep -i sdl2 || echo "no SDL2 library found"

      - name: Apply the Vita changes to the source
        run: |
          # CMakeLists.txt, main.c and tasks.c: edited by the lines' text, each edit only if it is not in yet (so it
          # does not matter if the repository has the sources as they were, or with an earlier version of these edits)
          python3 - <<'CMAKE_EDITS'
          import re, sys

          path = "CMakeLists.txt"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")
          problems = []

          # 1. the option, before the first option() of the file
          if "option(ORUNNERS_VITA" not in s:
              m = re.search(r"^option\(", s, re.M)
              if m:
                  s = s[:m.start()] + 'option(ORUNNERS_VITA "Build the game for the PlayStation Vita (VitaSDK, ports/vita)" OFF)\n\n' + s[m.start():]
              else:
                  problems.append("no option( line to put ORUNNERS_VITA before")

          # 2. the computer-only tools (the maker, the headless runs) are not for the Vita
          if "NOT ORUNNERS_VITA" not in s:
              s, n = re.subn(r"(NOT ORUNNERS_ANBERNIC)( AND NOT ANDROID)", r"\1 AND NOT ORUNNERS_VITA\2", s)
              if n == 0:
                  problems.append("no 'NOT ORUNNERS_ANBERNIC AND NOT ANDROID' condition found")

          # 3. the device dispatch: the Vita's file after the Anbernic's
          if "ports/vita/vita.cmake" not in s:
              s, n = re.subn(r"(elseif\(ORUNNERS_ANBERNIC\)\s*\n[ \t]*include\([^)\n]*anbernic\.cmake\)[ \t]*\n)",
                             r"\1\telseif(ORUNNERS_VITA)\n\t\tinclude(${CMAKE_SOURCE_DIR}/ports/vita/vita.cmake)\n", s)
              if n == 0:
                  problems.append("no 'elseif(ORUNNERS_ANBERNIC) include(...anbernic.cmake)' dispatch found")

          # 4. the desktop's SDL2 lookup is not for the Vita
          if "ORUNNERS_ANBERNIC OR ORUNNERS_VITA" not in s:
              s, n = re.subn(r"if\(ORUNNERS_ANBERNIC OR ORUNNERS_SWITCH OR ANDROID\)", "if(ORUNNERS_ANBERNIC OR ORUNNERS_VITA OR ORUNNERS_SWITCH OR ANDROID)", s)
              if n == 0:
                  problems.append("no 'if(ORUNNERS_ANBERNIC OR ORUNNERS_SWITCH OR ANDROID)' SDL2 condition found")

          if problems:
              print("CMakeLists.txt does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("the lines that name the devices, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if "ORUNNERS_ANBERNIC" in line or "ORUNNERS_SWITCH" in line or "ORUNNERS_VITA" in line:
                      print("%5d: %s" % (i, line))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("CMakeLists.txt: the Vita edits are in")
          else:
              print("CMakeLists.txt: the Vita edits were already in")
          CMAKE_EDITS
          python3 - <<'MAIN_EDITS'
          import re, sys

          path = "ports/sdl2/main.c"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")

          def norm(t):
              return re.sub(r"\s+", " ", t)

          def pattern(old):
              body = r"\s+".join(re.escape(t) for t in old.split())
              return re.compile(r"(?m)^[ \t]*" + body + (r"[ \t]*\n" if old.endswith("\n") else ""))

          # (name, a piece of the NEW text that says the edit is in, the OLD text it replaces, the NEW text)
          EDITS = []
          def edit(name, marker, old, new):
              EDITS.append((name, marker, old, new))

          edit("folder and includes", re.compile(r"#\s*define\s+VITA_FOLDER\b"),
          '''#if defined(ORUNNERS_HANDHELD) && !defined(_WIN32) && !defined(__SWITCH__)
          #include <unistd.h>        /* fsync: the log on the card as it is written */
          #endif
          ''','''#ifdef __vita__
          #include <sys/stat.h>      /* mkdir */
          #define VITA_FOLDER "ux0:data/OutRunners"    /* the game's folder on the memory card: its assets pack, what it writes */
          #endif
          #if defined(ORUNNERS_HANDHELD) && !defined(_WIN32) && !defined(__SWITCH__) && !defined(__vita__)
          #include <unistd.h>        /* fsync: the log on the card as it is written */
          #endif
          ''')

          edit("video workers", '#elif defined(__vita__) #define VIDEO_WORKERS',
          '''#else
          #define VIDEO_WORKERS       SDL_min(SDL_GetCPUCount() - 1, 3)''','''#elif defined(__vita__)
          #define VIDEO_WORKERS       2          /* (the Vita's cores beside the game's: tune it with outrunners.log's pace) */
          #else
          #define VIDEO_WORKERS       SDL_min(SDL_GetCPUCount() - 1, 3)''')

          edit("fsync", '!defined(__SWITCH__) && !defined(__vita__) fsync(fileno(stderr));',
          '''	fflush(stderr);
          #if !defined(_WIN32) && !defined(__SWITCH__)
          	fsync(fileno(stderr));''','''	fflush(stderr);
          #if !defined(_WIN32) && !defined(__SWITCH__) && !defined(__vita__)
          	fsync(fileno(stderr));''')

          edit("saves folder", re.compile(r"return\s+SDL_strdup\(\s*VITA_FOLDER", re.I),
          '''	return SDL_strdup(SWITCH_FOLDER "/");
          #elif defined(__ANDROID__)''','''	return SDL_strdup(SWITCH_FOLDER "/");
          #elif defined(__vita__)
          	mkdir(VITA_FOLDER, 0777);
          	return SDL_strdup(VITA_FOLDER "/");
          #elif defined(__ANDROID__)''')

          edit("log file", re.compile(r"freopen\(\s*VITA_FOLDER", re.I),
          '''#ifdef __ANDROID__
          	/* (what the game says goes to outrunners.log in the app's folder''','''#ifdef __vita__
          	/* (what the game says, failures included, goes to outrunners.log in its folder on the card: the Vita has no
          	   console to read it on) */
          	mkdir(VITA_FOLDER, 0777);
          	freopen(VITA_FOLDER "/outrunners.log", "w", stderr);
          	fprintf(stderr, "OutRunners: starting\\n");
          #endif
          #ifdef __ANDROID__
          	/* (what the game says goes to outrunners.log in the app's folder''')

          edit("window", re.compile(r"defined\(\s*__vita__\s*\)[^#]{0,300}?SDL_CreateWindow", re.S),
          '''#elif defined(ORUNNERS_HANDHELD)
          	window = SDL_CreateWindow(TITLE, SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 640, 480, SDL_WINDOW_FULLSCREEN_DESKTOP);''','''#elif defined(__vita__)
          	/* (the Vita's screen, 960 x 544: the system shows the window as all of it) */
          	window = SDL_CreateWindow(TITLE, 0, 0, 960, 544, SDL_WINDOW_SHOWN);
          #elif defined(ORUNNERS_HANDHELD)
          	window = SDL_CreateWindow(TITLE, SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 640, 480, SDL_WINDOW_FULLSCREEN_DESKTOP);''')

          edit("audio helper", 'static void queue_audio(const void *data, Uint32 bytes)',
          '''static SDL_AudioDeviceID audio;
          ''','''static SDL_AudioDeviceID audio;
          #ifdef __vita__
          static SDL_AudioStream *audio_resampler;    /* the mix's rate to the 48000 Hz the Vita's audio takes, when it does not take it */
          #endif

          /* The mix to the device's queue (through the resampler on the Vita, when there is one) */
          static void queue_audio(const void *data, Uint32 bytes)
          {
          #ifdef __vita__
          	if (audio_resampler)
          	{
          		Uint8 converted[8192];
          		int got;

          		if (SDL_AudioStreamPut(audio_resampler, data, (int)bytes) == 0)
          			while ((got = SDL_AudioStreamGet(audio_resampler, converted, sizeof(converted))) > 0)
          				SDL_QueueAudio(audio, converted, (Uint32)got);
          		return;
          	}
          #endif
          	SDL_QueueAudio(audio, data, bytes);
          }
          ''')

          edit("queue the mix", 'queue_audio(mix, (Uint32)(count * 2 * sizeof(int16_t)));',
          '''		SDL_QueueAudio(audio, mix, (Uint32)(count * 2 * sizeof(int16_t)));''','''		queue_audio(mix, (Uint32)(count * 2 * sizeof(int16_t)));''')

          edit("audio open", 'audio_resampler = SDL_NewAudioStream(',
          '''	audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          	if (audio)
          		SDL_PauseAudioDevice(audio, 0);
          ''','''	audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          #ifdef __vita__
          	if (!audio)
          	{
          		/* (the Vita's audio takes 48000 Hz and a few lower rates, not the chips' own: the mix goes through a
          		   stream that takes it to 48000) */
          		wanted.freq = 48000;
          		audio = SDL_OpenAudioDevice(NULL, 0, &wanted, NULL, 0);
          		if (audio)
          			audio_resampler = SDL_NewAudioStream(AUDIO_S16SYS, 2, (int)sound_chips_mix_rate(), AUDIO_S16SYS, 2, 48000);
          		if (audio && !audio_resampler)
          		{
          			SDL_CloseAudioDevice(audio);
          			audio = 0;
          		}
          	}
          #endif
          	if (audio)
          		SDL_PauseAudioDevice(audio, 0);
          ''')

          edit("audio close", 'SDL_FreeAudioStream(audio_resampler);',
          '''	if (audio)
          		SDL_CloseAudioDevice(audio);
          ''','''	if (audio)
          		SDL_CloseAudioDevice(audio);
          #ifdef __vita__
          	if (audio_resampler)
          		SDL_FreeAudioStream(audio_resampler);
          #endif
          ''')

          edit("renderer", 'SDL lists the Vita',
          '''	renderer = window ? SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED) : NULL;
          ''','''#ifdef __vita__
          	/* SDL lists the Vita's GLES2 renderer before its GXM one, and the GLES2 one compiles its shaders as it runs,
          	   with libshacccg.suprx: a file of the Vita's firmware that not every setup has (and Vita3K has not). The GXM
          	   renderer has its shaders built in and needs nothing */
          	renderer = NULL;
          	for (int driver = 0; window && !renderer && driver < SDL_GetNumRenderDrivers(); driver++)
          	{
          		SDL_RendererInfo driver_info;

          		if (SDL_GetRenderDriverInfo(driver, &driver_info) == 0 && driver_info.name
          			&& (SDL_strstr(driver_info.name, "gxm") || SDL_strstr(driver_info.name, "GXM")))
          			renderer = SDL_CreateRenderer(window, driver, 0);
          	}
          	if (window && !renderer)
          		renderer = SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED);
          #else
          	renderer = window ? SDL_CreateRenderer(window, -1, SDL_RENDERER_ACCELERATED) : NULL;
          #endif
          ''')

          problems = []
          done = []
          def is_in(marker):
              if hasattr(marker, "search"):
                  return marker.search(s) is not None
              return norm(marker) in norm(s)

          for name, marker, old, new in EDITS:
              if is_in(marker):
                  done.append(name + ": already in")
                  continue
              pat = pattern(old)
              found = pat.findall(s)
              if len(found) != 1:
                  problems.append("%s: the text to change was found %d times (wanted 1)" % (name, len(found)))
                  continue
              s = pat.sub(lambda m: new, s, count=1)
              done.append(name + ": added")

          for line in done:
              print("  " + line)
          if problems:
              print("main.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("the lines with SDL_CreateRenderer / SDL_OpenAudioDevice / SDL_QueueAudio, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if "SDL_CreateRenderer" in line or "SDL_OpenAudioDevice" in line or "SDL_QueueAudio" in line or "VITA_FOLDER" in line:
                      print("%5d: %s" % (i, line))
              sys.exit(1)

          print("the Vita lines of main.c now:")
          for i, line in enumerate(s.split("\n"), 1):
              if "__vita__" in line or "VITA_FOLDER" in line or "audio_resampler" in line:
                  print("%5d: %s" % (i, line.strip()[:110]))
          s = s.replace("\n", nl)
          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("ports/sdl2/main.c: the Vita edits are in")
          else:
              print("ports/sdl2/main.c: the Vita edits were already in")
          MAIN_EDITS
          python3 - <<'TASKS_EDITS'
          import re, sys

          path = "runtime/src/tasks.c"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")
          problems = []
          done = []

          VITA_BRANCH = r"""#elif defined(__vita__)

          /* The Vita's C library has no ucontext either: as on the aarch64 above, a task's registers are kept on its own
             stack. What a call keeps for its caller (AAPCS: r4-r11, the return address lr, d8-d15) is pushed where the
             task stops and popped where it goes on; the stack pointer is all the task keeps beside it. The routine is
             assembled as ARM code whichever the file is (and the mode put back after it), with no instruction that
             Thumb-2 would take for another (SP stored with a plain str) */
          #define SAVED_WORDS 25    /* d8-d15 (16 words, lowest), r4-r11 (8), lr (the highest) */

          void host_switch_stacks(void **from_stack, void *to_stack);

          __asm__(
          	".text\n"
          	".arm\n"
          	".align 2\n"
          	".global host_switch_stacks\n"
          	".type host_switch_stacks, %function\n"
          	"host_switch_stacks:\n"
          	"	push {r4-r11, lr}\n"
          	"	vpush {d8-d15}\n"
          	"	mov r2, sp\n"
          	"	str r2, [r0]\n"
          	"	mov sp, r1\n"
          	"	vpop {d8-d15}\n"
          	"	pop {r4-r11, lr}\n"
          	"	bx lr\n"
          	".size host_switch_stacks, .-host_switch_stacks\n"
          #ifdef __thumb__
          	".thumb\n"
          #else
          	".arm\n"
          #endif
          );

          struct host_task
          {
          	void *stack_pointer;    /* where it stopped: its registers on top */
          	void *stack;
          	void (*start)(void);
          };

          static host_task main_task;
          static host_task *current;

          host_task *host_task_main(void)
          {
          	if (!current)
          		current = &main_task;
          	return &main_task;
          }

          static void run_task(void)
          {
          	current->start();
          	fprintf(stderr, "A task came to its end\n");
          	exit(3);
          }

          host_task *host_task_create(void (*start)(void))
          {
          	host_task *task = calloc(1, sizeof(*task));
          	uintptr_t top;
          	uint32_t *registers;

          	if (task)
          		task->stack = malloc(TASK_STACK_SIZE);
          	if (!task || !task->stack)
          	{
          		fprintf(stderr, "A task could not be created\n");
          		exit(3);
          	}
          	task->start = start;
          	/* its first switch pops registers that return into run_task, and leaves the stack pointer at the top of
          	   its stack, 8-byte aligned as a call wants it */
          	top = ((uintptr_t)task->stack + TASK_STACK_SIZE) & ~(uintptr_t)7;
          	registers = (uint32_t *)(top - SAVED_WORDS * sizeof(uint32_t));
          	memset(registers, 0, SAVED_WORDS * sizeof(uint32_t));
          	registers[SAVED_WORDS - 1] = (uint32_t)(uintptr_t)run_task;    /* (lr: where the first bx goes) */
          	task->stack_pointer = registers;
          	return task;
          }

          void host_task_switch(host_task *to)
          {
          	host_task *from = current;

          	if (to == from)
          		return;
          	current = to;
          	host_switch_stacks(&from->stack_pointer, to->stack_pointer);
          }

          """

          # 1. the Vita's stack size for a task: its memory is 256 MB in all, not 16 MB for each task
          if re.search(r"#\s*(ifdef\s+__vita__|if\s+defined\(\s*__vita__\s*\))\s*\n\s*#\s*define\s+TASK_STACK_SIZE", s):
              done.append("stack size: already in")
          else:
              s, n = re.subn(r"(?m)^#define TASK_STACK_SIZE \(16u << 20\)[ \t]*\n",
                  "#ifdef __vita__\n#define TASK_STACK_SIZE (4u << 20)     /* (the Vita's memory is 256 MB in all: less than the others' 16 MB each) */\n#else\n#define TASK_STACK_SIZE (16u << 20)\n#endif\n", s, count=1)
              if n == 1:
                  done.append("stack size: added")
              else:
                  problems.append("stack size: no '#define TASK_STACK_SIZE (16u << 20)' line found")

          # 2. the Vita's task switch: its registers kept on the task's own stack (its C library has no ucontext)
          if re.search(r"#\s*elif\s+defined\(\s*__vita__\s*\)", s) or "r4-r11" in s:
              done.append("Vita task switch: already in")
          else:
              s, n = re.subn(r"(?m)^#else[ \t]*\n[ \t]*\n#include <ucontext\.h>", lambda m: VITA_BRANCH + "#else\n\n#include <ucontext.h>", s, count=1)
              if n == 1:
                  done.append("Vita task switch: added")
              else:
                  problems.append("Vita task switch: no '#else / #include <ucontext.h>' branch found to put it before")

          for line in done:
              print("  " + line)
          print("the Vita lines of tasks.c now:")
          for i, line in enumerate(s.split("\n"), 1):
              if "__vita__" in line or "TASK_STACK_SIZE" in line or "r4-r11" in line or "host_switch_stacks:" in line:
                  print("%5d: %s" % (i, line.strip()[:110]))
          if problems:
              print("tasks.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("its #if lines, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if re.match(r"\s*#\s*(if|elif|else|endif)", line):
                      print("%5d: %s" % (i, line.strip()[:110]))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/tasks.c: the Vita edits are in")
          else:
              print("runtime/src/tasks.c: the Vita edits were already in")
          TASKS_EDITS

      - name: Check that the Vita code is in the source (fails if not)
        run: |
          echo "main.c: audio_resampler x$(grep -c audio_resampler ports/sdl2/main.c), gxm x$(grep -c gxm ports/sdl2/main.c)"
          echo "tasks.c: host_switch_stacks x$(grep -c host_switch_stacks runtime/src/tasks.c)"
          echo "vita.cmake version: $(grep -o 'ORUNNERS_VITA_VERSION "[0-9.]*"' ports/vita/vita.cmake)"
          grep -q audio_resampler ports/sdl2/main.c
          grep -q gxm ports/sdl2/main.c
          grep -q host_switch_stacks runtime/src/tasks.c

      - name: Configure
        run: |
          cmake -S . -B build/vita -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DORUNNERS_VITA=ON -DCMAKE_BUILD_TYPE=Release -DORUNNERS_REFERENCE_TOOLS=OFF 2>&1 | tee configure.log

      - name: Build
        run: |
          cmake --build build/vita --target OutRunners.vpk 2>&1 | tee build.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

      - name: Keep the VPK
        uses: actions/upload-artifact@v4
        with:
          name: OutRunners-vita-vpk
          path: build/vita/OutRunners.vpk
