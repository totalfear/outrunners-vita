          # --- overlap (Vita only): the frame's video drawn on the workers' cores while the game runs its next frame ---
          # A frame was strictly one thing after another: the game and the sound program on core 0 while cores 1
          # and 2 did nothing, then the picture on all three, then showing it. With overlap the picture of a frame
          # is begun when VBLANK starts (a copy of what the video reads of the board, runtime/src/video.c) and the
          # workers draw it while core 0 presents the frame before it and runs the game's next frame; the sprite
          # lists the board sends go to the workers the same way. The picture is ended when the next VBLANK
          # starts, core 0 taking what rows are left, and shown then: a frame costs about the larger of the two
          # rather than their sum, and the picture reaches the screen one VBLANK later than it did.
          # OPTIONS > VIDEO > ZERO INPUT LAG turns it off from the next start (the frame is then drawn and shown as it was)
          edit("overlap variables", 'static bool vita_overlap',
          """/* The frames drawn into the window */
          static void show_screens(void)
          {""","""#ifdef __vita__
          static bool vita_overlap = true;    /* overlap.txt: a frame's video is drawn while the game runs the next frame (0: drawn and waited for when VBLANK starts, as it was) */
          static bool vita_frame_begun;       /* a frame's video is begun, and not shown yet */
          static bool vita_begin_wanted;      /* on_frame_shown: show_screens begins this frame's video once the texture has the last one */
          static uint64_t vita_begin_time;    /* what beginning it took, for the log's "its video" */
          bool orunners_vita_low_lag_started; /* ZERO INPUT LAG as the game started with it (console/menu.c: a change is for the next start) */

          /* The stutter's test: the screen's refreshes (sceDisplayGetVcount) between one picture sent and the next. One
             is right; two or more, a picture held on the screen (a stutter); none, two sent in one refresh, the first
             never seen (a stutter too: the game keeps its own 60 a second, the screen its own rate). And the log's
             writes to the card, timed, now every 30 seconds (log_pace) */
          #include <psp2/display.h>
          static unsigned vita_held, vita_held_most, vita_unseen, vita_held_after_log;
          static bool vita_log_just_written;     /* the log went to the card since the last picture */
          static double vita_log_write_ms;       /* what its last write took */

          /* The frames' pace on the Vita: the screen's own refresh, not the game's clock (wait_for_frame). The two
             are both 60 a second, but not in step: where a picture went out just past a refresh it was shown for
             two and the next one not at all, a few times a second for a while (the stutter's test above said so,
             a third of the time). So a frame begins at a refresh: a picture each. A frame that ran past its refresh
             is not waited for, so the next one catches up; far behind (a stage loading), the count starts over */
          static void vita_wait_for_refresh(void)
          {
          	static unsigned target;
          	static bool started;
          	const unsigned now = (unsigned)sceDisplayGetVcount();

          	if (!started || (int)(now - target) > 15)
          	{
          		target = now;
          		started = true;
          	}
          	target++;
          	while ((int)(target - (unsigned)sceDisplayGetVcount()) > 0)
          		sceDisplayWaitVblankStart();
          }
          #endif

          /* The frames drawn into the window */
          static void show_screens(void)
          {""")

          edit("overlap begin", 'vita_begin_wanted = false;',
          """#ifdef ORUNNERS_TOUCH
          	if (console_side_map_shown())
          		upload_side_map();
          #endif
          	present(source);""","""#ifdef ORUNNERS_TOUCH
          	if (console_side_map_shown())
          		upload_side_map();
          #endif
          #ifdef __vita__
          	if (vita_begin_wanted)
          	{
          		/* (overlap: the texture has the last frame, so this one's video is begun before that one is presented:
          		   the workers draw it meanwhile) */
          		const uint64_t begin_start = SDL_GetPerformanceCounter();

          		vita_begin_wanted = false;
          		s32_video_draw_frame_begin();
          		vita_begin_time = SDL_GetPerformanceCounter() - begin_start;
          	}
          #endif
          	present(source);
          #ifdef __vita__
          	{
          		/* (the stutter's test: the refreshes since the last picture sent) */
          		static unsigned last_vcount;
          		static bool counting;
          		const unsigned vcount = (unsigned)sceDisplayGetVcount();
          		const unsigned refreshes = vcount - last_vcount;

          		if (counting && refreshes >= 2)
          		{
          			vita_held++;
          			if (refreshes > vita_held_most)
          				vita_held_most = refreshes;
          			if (vita_log_just_written)
          				vita_held_after_log++;
          		}
          		else if (counting && refreshes == 0)
          			vita_unseen++;
          		vita_log_just_written = false;
          		last_vcount = vcount;
          		counting = true;
          	}
          #endif""")

          edit("overlap frame", 'vita_frame_begun = vita_begin_wanted = !skipped;',
          """	s32_video_draw_frame();
          	drawn = SDL_GetPerformanceCounter();
          	show_screens();
