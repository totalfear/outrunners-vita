          	pace_showing += SDL_GetPerformanceCounter() - drawn;""","""#ifdef __vita__
          	if (vita_overlap)
          	{
          		/* overlap (overlap.txt): the frame begun when the last VBLANK started is drawn by now on the workers'
          		   threads, or this thread takes the rows that are left (s32_video_draw_frame_end). It goes to the
          		   texture; this VBLANK's frame is begun then (in show_screens, between the texture and the present)
          		   and is drawn while that one is presented and the game runs its next frame. A frame frameskip.txt
          		   leaves out is not begun: the one begun before it is shown here, a VBLANK after it was begun */
          		if (vita_frame_begun)
          		{
          			s32_video_draw_frame_end();
          			drawn = SDL_GetPerformanceCounter();
          			vita_frame_begun = vita_begin_wanted = !skipped;
          			vita_begin_time = 0;
          			show_screens();
          			pace_video += drawn - start + vita_begin_time;
