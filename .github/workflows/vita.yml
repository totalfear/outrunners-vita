                  done.append("switch counter: added")

          for line in done:
              print("  " + line)
          print("the Vita lines of tasks.c now:")
          for i, line in enumerate(s.split("\n"), 1):
              if "__vita__" in line or "TASK_STACK_SIZE" in line or "r4-r11" in line or "host_switch_stacks:" in line or "VITA_TASK_COUNTER" in line:
                  print("%5d: %s" % (i, line.strip()[:110]))
          if problems:
              print("tasks.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("its #if lines, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if re.match(r"\s*#\s*(if|elif|else|endif)", line):
                      print("%5d: %s" % (i, line.strip()[:110]))
              sys.exit(1)

          s = s.replace("\n", nl)
          if s != orig:
              open(path, "w", encoding="utf-8", newline="").write(s)
              print("runtime/src/tasks.c: the Vita edits are in")
          else:
              print("runtime/src/tasks.c: the Vita edits were already in")
          TASKS_EDITS
          python3 - <<'WORKERS_EDITS'
          import re, sys

          path = "runtime/src/workers.c"
          s = open(path, encoding="utf-8", newline="").read()
          orig = s
          nl = "\r\n" if "\r\n" in s else "\n"
          s = s.replace("\r\n", "\n")

          def norm(t):
              return re.sub(r"\s+", " ", t)

          def pattern(old):
              body = r"\s+".join(re.escape(t) for t in old.split())
              return re.compile(r"(?m)^[ \t]*" + body + (r"[ \t]*\n" if old.endswith("\n") else ""))

          # (name, a piece of the NEW text that says the edit is in, the OLD text it replaces, the NEW text)
          EDITS = []
          def edit(name, marker, old, new):
              EDITS.append((name, marker, old, new))

          edit("worker cores", 'orunners_vita_pin',
          """static void worker_loop(int number)
          {
          	unsigned seen = 0;
          ""","""#ifdef __vita__
          void orunners_vita_pin(int mask);    /* (ports/vita/vita_pin.c) */
          #endif

          static void worker_loop(int number)
          {
          	unsigned seen = 0;

          #ifdef __vita__
          	/* (the app's cores: 0 the game's, 1 and 2 the video's workers, as on the Switch; the system keeps the fourth) */
          	orunners_vita_pin(0x20000 << (number % 2));
          #endif
          """)

          problems = []
          done = []
          def is_in(marker):
              if hasattr(marker, "search"):
                  return marker.search(s) is not None
              return norm(marker) in norm(s)

          for name, marker, old, new in EDITS:
              if is_in(marker):
                  done.append(name + ": already in")
                  continue
              pat = pattern(old)
              found = pat.findall(s)
              if len(found) != 1:
                  problems.append("%s: the text to change was found %d times (wanted 1)" % (name, len(found)))
                  continue
              s = pat.sub(lambda m: new, s, count=1)
              done.append(name + ": added")

          for line in done:
              print("  " + line)
          if problems:
              print("workers.c does not look as expected:")
              for p in problems:
                  print("  -", p)
              print("the lines of worker_loop, for a look:")
              for i, line in enumerate(s.split("\n"), 1):
                  if "worker_loop" in line or "orunners_vita_pin" in line:
                      print("%5d: %s" % (i, line))
              sys.exit(1)

          print("the Vita lines of workers.c now:")
          for i, line in enumerate(s.split("\n"), 1):
              if "__vita__" in line or "orunners_vita_pin" in line:
                  print("%5d: %s" % (i, line.strip()[:110]))
